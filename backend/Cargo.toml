[package]
name = "just-download-backend"
version = "2.1.0"
edition = "2021"
authors = ["oiupoyt"]
description = "Ultra-fast, memory-efficient Rust backend for just-download"

[dependencies]
axum = { version = "0.7", default-features = false, features = ["tokio", "http1", "http2", "json"] }
tokio = { version = "1.38", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs", "compression-full"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
uuid = { version = "1.9", features = ["v4", "fast-rng"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
mime_guess = "2.0"
which = "6.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
